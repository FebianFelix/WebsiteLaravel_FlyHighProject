name: Refresh Composer lockfile
on:
  push:
    branches: [master]
    paths:
      - 'composer.json'
      - '.github/workflows/lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, fileinfo, intl, gd, zip
          coverage: none
      - name: Resolve and lock dependencies
        run: composer update --no-install --no-scripts --no-interaction --prefer-dist
      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: pin Composer dependencies for reproducible installs"
            git push origin HEAD:master
          fi
