name: FlyHigh CI/CD

on:
  push:
    branches: [demo, dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyhigh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  promotion-policy:
    name: Require dev branch for production PRs
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev to master promotion
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE_BRANCH" != "dev" ]]; then
            echo "Production pull requests must originate from dev" >&2
            exit 1
          fi

  test-sqlite:
    name: Unit & feature tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, fileinfo, intl, gd, zip
          coverage: none
          tools: composer:v2
      - name: Validate dependency manifest and lockfile
        run: composer validate --strict --no-check-publish
      - name: Install pinned dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare test app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Validate installation, release and deployment scripts
        run: bash -n scripts/*.sh docker/deploy-entrypoint.sh
      - name: PHP syntax lint
        run: find app routes config database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Source archive smoke test
        run: bash scripts/package-release.sh
      - name: Route compilation
        run: |
          php artisan route:list --except-vendor
          php artisan route:cache
          php artisan route:clear
      - name: Run SQLite test suite
        run: php artisan test

  test-mysql:
    if: github.ref != 'refs/heads/demo' && github.base_ref != 'demo'
    name: Integration tests (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: flyhigh_ci
          MYSQL_USER: flyhigh_ci
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, fileinfo, intl, gd, zip
          coverage: none
          tools: composer:v2
      - name: Install pinned dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare test app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests against real MySQL
        run: vendor/bin/phpunit --configuration=phpunit.mysql.xml

  demo-smoke:
    name: Offline demo SQLite smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, fileinfo, intl, gd, zip
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Boot offline demo database
        run: |
          cp .env.demo.example .env
          touch database/demo.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force
          php artisan migrate:status
          php artisan route:list --except-vendor

  presentation-browser:
    name: Presentation Docker + HTTP end-to-end
    if: github.ref == 'refs/heads/demo' || github.base_ref == 'demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo shell scripts
        run: bash -n scripts/*.sh docker/demo-entrypoint.sh
      - name: Build, initialize and start standalone Docker demo
        run: docker compose -f docker-compose.demo.yml up --build -d --wait
      - name: Smoke test real HTTP and administrator login
        run: bash scripts/demo-http-smoke.sh
      - name: Collect container diagnostics if failed
        if: failure()
        run: |
          docker compose -f docker-compose.demo.yml ps
          docker compose -f docker-compose.demo.yml logs --tail=120 demo
      - name: Stop disposable presentation
        if: always()
        run: docker compose -f docker-compose.demo.yml down --volumes --remove-orphans

  image:
    name: Build and publish immutable image
    if: github.event_name == 'push' && github.ref != 'refs/heads/demo'
    needs: [test-sqlite, test-mysql, demo-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image identifier
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Proprietary
            org.opencontainers.image.authors=FebianFelix
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pin deployable image by registry digest
        id: digest
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy-development:
    name: Deploy development environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.DEPLOY_DEVELOPMENT_ENABLED == 'true'
    needs: [test-sqlite, test-mysql, image]
    runs-on: ubuntu-latest
    concurrency:
      group: flyhigh-deploy-development
      cancel-in-progress: false
    environment:
      name: development
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy tested image via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
          DEPLOY_HTTP_PORT: ${{ vars.DEPLOY_HTTP_PORT }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          FLYHIGH_IMAGE: ${{ needs.image.outputs.image }}
          FLYHIGH_EXPECTED_ENV: development
        run: bash scripts/cd-deploy.sh

  deploy-production:
    name: Deploy protected production environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_PRODUCTION_ENABLED == 'true'
    needs: [test-sqlite, test-mysql, image]
    runs-on: ubuntu-latest
    concurrency:
      group: flyhigh-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy release via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
          DEPLOY_HTTP_PORT: ${{ vars.DEPLOY_HTTP_PORT }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          FLYHIGH_IMAGE: ${{ needs.image.outputs.image }}
          FLYHIGH_EXPECTED_ENV: production
        run: bash scripts/cd-deploy.sh
