name: Laravel Quality & Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, dom, xml, curl, fileinfo, intl, gd, zip
          coverage: none
      - name: Composer validation
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: PHP syntax lint
        run: find app routes database tests config -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Laravel route list
        run: php artisan route:list --except-vendor
      - name: Feature & Unit tests
        run: php artisan test
