name: Laravel Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint application PHP
        run: find app routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php artisan test
