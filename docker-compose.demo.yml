# Demo branch ONLY: disposable, local, fictional data; no MySQL/Stripe/Duffel/SMTP.
name: flyhigh-presentation

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: flyhigh-presentation:local
    entrypoint: ["/bin/sh", "/var/www/html/docker/demo-entrypoint.sh"]
    env_file:
      - .env.demo.example
    environment:
      APP_NAME: "FlyHigh Presentation"
      APP_ENV: demo
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:${FLYHIGH_DEMO_PORT:-8088}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/demo/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_COOKIE: flyhigh_presentation_session
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      FLYHIGH_DEMO_PAYMENTS: "true"
      FLYHIGH_PAYMENT_GATEWAY: disabled
      FLYHIGH_FLIGHT_PROVIDER: disabled
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      DUFFEL_ACCESS_TOKEN: ""
    ports:
      - "127.0.0.1:${FLYHIGH_DEMO_PORT:-8088}:8000"
    volumes:
      - presentation_data:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  presentation_data:
